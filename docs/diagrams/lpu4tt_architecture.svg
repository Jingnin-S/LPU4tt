<text x="70.00" y="1285.00" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#718096">Scope: CPU SGLang connects to the C++ device model; physical GPIO driver and silicon bring-up remain future work.</text>
<text x="70.00" y="1325.00" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#718096">Clock: 100MHz is internal macro STA; nominal external input pad rating is ~66MHz. No PLL or CDC in this design.</text>
