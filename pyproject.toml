[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinylpu"
version = "0.2.1"
description = "Compiler-driven integer LPU architecture experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.2.6"]

[tool.setuptools.packages.find]
where = ["compiler"]
